<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Flowr by Shani</title>
<meta name="description" content="Hand-painted and cross-stitch cushion covers, table runners and wraparounds, made by hand in Sri Lanka.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cg fill='%23d4136e'%3E%3Ccircle cx='16' cy='8' r='6'/%3E%3Ccircle cx='24' cy='15' r='6'/%3E%3Ccircle cx='20' cy='24' r='6'/%3E%3Ccircle cx='11' cy='24' r='6'/%3E%3Ccircle cx='8' cy='15' r='6'/%3E%3C/g%3E%3Ccircle cx='16' cy='17' r='3' fill='%23f6d02e'/%3E%3C/svg%3E">
<script src="config.js"></script>
<style>
@font-face{font-family:"Short Stack";src:url(assets/fonts/short-stack-latin-400-normal.woff2) format("woff2");font-display:swap}
@font-face{font-family:Nunito;font-weight:400;src:url(assets/fonts/nunito-latin-400-normal.woff2) format("woff2");font-display:swap}
@font-face{font-family:Nunito;font-weight:600;src:url(assets/fonts/nunito-latin-600-normal.woff2) format("woff2");font-display:swap}
@font-face{font-family:Nunito;font-weight:700;src:url(assets/fonts/nunito-latin-700-normal.woff2) format("woff2");font-display:swap}
:root{--ink:#33261f;--muted:#7d6b5e;--magenta:#c8136a;--magenta-dk:#a30f56;--green:#2f7a3a;--cloth:#fbf8f2;--card:#fff;--line:#ebe2d4;--radius:10px}
*{box-sizing:border-box}
html{background:var(--cloth)}
body{margin:0;color:var(--ink);font:16px/1.5 Nunito,system-ui,sans-serif;background:url(assets/muslin.svg),var(--cloth);min-height:100vh}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.32;
 background:url(assets/batik-bg.svg) right -140px top 80px/min(820px,120vw) no-repeat}
button,input,textarea{font:inherit;color:inherit}
a{color:var(--magenta)}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}
header.wrap{padding-top:18px}
.banner svg{width:100%;height:auto;display:block;border-radius:8px;box-shadow:0 4px 18px rgba(110,70,20,.15)}
.intro{text-align:center;color:var(--muted);margin:18px auto 6px;max-width:560px}
.filters{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:14px 0 6px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 15px;font-weight:600;font-size:14px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
section.coll{margin:34px 0 10px}
.coll h2{font-family:"Short Stack",cursive;font-weight:400;font-size:28px;margin:0 0 4px;color:var(--magenta)}
.coll.xmas h2{color:#b3122e}
.coll .sub{color:var(--muted);margin:0 0 16px;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(200px,44%),1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column}
.card .img{all:unset;cursor:pointer;display:block;aspect-ratio:1;background:#f1ebe0}
.card .img img{width:100%;height:100%;object-fit:cover;display:block}
.card .body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:2px;flex:1}
.card h3{font-size:15px;margin:0;line-height:1.3}
.meta{color:var(--muted);font-size:13px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto;padding-top:8px}
.price{font-weight:700}
.left{font-size:12px;color:var(--green);font-weight:600}
.btn{border:0;border-radius:8px;background:var(--magenta);color:#fff;font-weight:700;padding:9px 14px;cursor:pointer}
.btn:hover{background:var(--magenta-dk)}
.btn:disabled{background:#cbbfb3;cursor:default}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:7px 11px;font-size:14px}
.btn.wide{width:100%;padding:13px}
.empty-note{color:var(--muted);text-align:center;padding:30px 0}
footer{color:var(--muted);text-align:center;font-size:14px;padding:50px 16px 90px}
/* basket button */
.basket-btn{position:fixed;right:16px;bottom:16px;z-index:20;display:flex;align-items:center;gap:8px;border:0;border-radius:999px;background:var(--ink);color:#fff;padding:12px 18px;font-weight:700;box-shadow:0 6px 20px rgba(0,0,0,.2);cursor:pointer}
.basket-btn .n{background:var(--magenta);border-radius:999px;min-width:22px;height:22px;display:grid;place-items:center;font-size:13px;padding:0 6px}
/* panels */
.overlay{position:fixed;inset:0;background:rgba(30,20,15,.45);z-index:30;display:none}
.overlay.open{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:#fff;z-index:31;transform:translateX(100%);transition:transform .25s ease;display:flex;flex-direction:column}
.drawer.open{transform:none}
.drawer header{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line)}
.drawer h2{margin:0;font-size:19px}
.x{border:0;background:none;font-size:26px;line-height:1;cursor:pointer;color:var(--muted);padding:4px 8px}
.drawer .content{overflow:auto;padding:16px 18px;flex:1}
.drawer .foot{border-top:1px solid var(--line);padding:14px 18px}
.line{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.line img{width:64px;height:64px;object-fit:cover;border-radius:6px}
.line .t{font-weight:600;font-size:14px;line-height:1.3}
.qty{display:flex;align-items:center;gap:6px;margin-top:4px}
.qty button{width:28px;height:28px;border:1px solid var(--line);background:#fff;border-radius:6px;cursor:pointer}
.qty .rm{width:auto;border:0;color:var(--muted);text-decoration:underline;font-size:13px;margin-left:6px}
.tot{display:flex;justify-content:space-between;font-weight:700;margin-bottom:4px}
.small{font-size:13px;color:var(--muted)}
.how{background:#fdf6e3;border:1px solid #f0e2b8;border-radius:8px;padding:12px 14px;font-size:14px;margin-bottom:16px}
.how ol{margin:6px 0 0;padding-left:20px}
.how li{margin:3px 0}
label{display:block;font-weight:600;font-size:14px;margin:12px 0 4px}
label span{font-weight:400;color:var(--muted)}
input,textarea{width:100%;border:1px solid #d9cdbb;border-radius:8px;padding:10px 12px;background:#fff}
input:focus,textarea:focus{outline:2px solid var(--magenta);outline-offset:-1px;border-color:transparent}
textarea{min-height:72px;resize:vertical}
.note{font-size:14px;background:#f6f1ea;border-radius:8px;padding:10px 12px;margin:14px 0 0}
.err{color:#b3122e;font-size:14px;margin:10px 0 0}
.hp{position:absolute;left:-9999px}
.done{text-align:center;padding:24px 4px}
.done .big{font-size:22px;font-weight:700;margin:6px 0}
.preview{background:#fff4c2;text-align:center;font-size:13px;padding:6px}
/* product modal */
.modal{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;padding:16px}
.modal.open{display:flex}
.modal .box{background:#fff;border-radius:12px;max-width:820px;width:100%;max-height:92vh;overflow:auto;display:grid;grid-template-columns:1.1fr 1fr;position:relative}
.modal .gal img.main{width:100%;aspect-ratio:1;object-fit:contain;background:#f4efe6;display:block}
.thumbs{display:flex;gap:6px;padding:8px}
.thumbs img{width:56px;height:56px;object-fit:cover;border-radius:6px;cursor:pointer;opacity:.6}
.thumbs img.on{opacity:1;outline:2px solid var(--magenta)}
.modal .info{padding:22px 20px;display:flex;flex-direction:column;gap:8px}
.modal h3{margin:0;font-size:20px}
.modal .x{position:absolute;top:6px;right:6px;background:#fff;border-radius:50%}
@media (max-width:640px){.modal .box{grid-template-columns:1fr}.coll h2{font-size:24px}}
</style>
</head>

<script>
(function(){
var API = (window.SHOP_CONFIG && SHOP_CONFIG.API_URL) || '';
var WA = (window.SHOP_CONFIG && SHOP_CONFIG.WHATSAPP) || '';
var products = [], bySku = {}, filter = '', basket = load();
var $ = function(s){return document.querySelector(s)};
var fmt = function(n){return 'LKR ' + Number(n).toLocaleString('en-US')};
var esc = function(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var img = function(f){return 'images/' + encodeURIComponent(f)};

if (WA){ var w=$('#waLink'); w.textContent=WA; w.href='https://wa.me/'+WA.replace(/\D/g,''); $('#waLine').hidden=false; }

function load(){ try{ return JSON.parse(localStorage.getItem('flowr-basket')) || {}; }catch(e){ return {}; } }
function save(){ try{ localStorage.setItem('flowr-basket', JSON.stringify(basket)); }catch(e){} updateCount(); }
function updateCount(){ var n=0; for (var k in basket) n+=basket[k]; $('#count').textContent=n; }

function fetchProducts(){
  var url = API ? API + '?t=' + Date.now() : 'products.json';
  if (!API) $('#previewBar').hidden = false;
  return fetch(url).then(function(r){return r.json()}).then(function(d){
    products = (d.products || d).filter(function(p){return p.available > 0});
    bySku = {}; products.forEach(function(p){bySku[p.sku]=p});
    // keep basket in line with live stock
    for (var k in basket){ if(!bySku[k]) delete basket[k]; else if (basket[k] > bySku[k].available) basket[k] = bySku[k].available; }
    save(); render();
  }).catch(function(){ $('#shop').innerHTML = '<p class="empty-note">Could not load products. Please refresh the page.</p>'; });
}

var COLLS = [
  {key:'Christmas', title:'Christmas', sub:'Poinsettias, Santas, snowflakes and holly for the season.', cls:'xmas'},
  {key:'Flowers', title:'Flowers', sub:'Hibiscus, lilies, butterfly-pea, araliya and more.', cls:''}
];

function render(){
  var html = '';
  COLLS.forEach(function(c){
    var list = products.filter(function(p){return p.collection===c.key && (!filter || p.category===filter)});
    if (!list.length) return;
    html += '<section class="coll '+c.cls+'" id="'+c.key.toLowerCase()+'"><h2>'+c.title+'</h2><p class="sub">'+c.sub+'</p><div class="grid">' + list.map(card).join('') + '</div></section>';
  });
  $('#shop').innerHTML = html || '<p class="empty-note">Nothing in this category right now.</p>';
}

function card(p){
  var inB = basket[p.sku] || 0, full = inB >= p.available;
  return '<article class="card"><button class="img" data-open="'+esc(p.sku)+'" aria-label="View '+esc(p.name)+'"><img loading="lazy" src="'+img(p.photos[0])+'" alt="'+esc(p.name)+'"></button>'+
    '<div class="body"><h3>'+esc(p.name)+'</h3><div class="meta">'+esc(p.category)+' · '+esc(p.technique)+'</div>'+
    (p.available>1 ? '<div class="left">'+p.available+' available</div>' : '<div class="left">Only 1</div>')+
    '<div class="row"><span class="price">'+fmt(p.price)+'</span><button class="btn sm" data-add="'+esc(p.sku)+'"'+(full?' disabled':'')+'>'+(full?'In basket':'Add')+'</button></div></div></article>';
}

function add(sku){
  var p = bySku[sku]; if(!p) return;
  basket[sku] = Math.min((basket[sku]||0)+1, p.available); save(); render();
  var b=$('#basketBtn'); b.animate && b.animate([{transform:'scale(1)'},{transform:'scale(1.12)'},{transform:'scale(1)'}],{duration:300});
}

// ---- product modal ----
function openProduct(sku){
  var p = bySku[sku]; if(!p) return;
  var inB = basket[sku]||0, full = inB >= p.available;
  $('#modalBox').innerHTML = '<button class="x" data-close-modal aria-label="Close">×</button>'+
    '<div class="gal"><img class="main" id="mainImg" src="'+img(p.photos[0])+'" alt="'+esc(p.name)+'">'+
    (p.photos.length>1 ? '<div class="thumbs">'+p.photos.map(function(f,i){return '<img src="'+img(f)+'" data-thumb="'+esc(f)+'" class="'+(i?'':'on')+'" alt="">'}).join('')+'</div>' : '')+'</div>'+
    '<div class="info"><h3>'+esc(p.name)+'</h3><div class="price">'+fmt(p.price)+'</div>'+
    '<div class="meta">'+esc(p.category)+' · '+esc(p.technique)+(p.size?' · '+esc(p.size):'')+'</div>'+
    '<p style="margin:4px 0">'+esc(p.description)+'</p><div class="left">'+p.available+' available</div>'+
    '<button class="btn wide" data-add="'+esc(p.sku)+'" data-close-modal'+(full?' disabled':'')+'>'+(full?'In basket':'Add to basket')+'</button></div>';
  $('#modal').classList.add('open'); $('#overlay').classList.add('open');
}
function closeModal(){ $('#modal').classList.remove('open'); if(!$('#drawer').classList.contains('open')) $('#overlay').classList.remove('open'); }

// ---- basket drawer ----
function openDrawer(){ $('#drawer').classList.add('open'); $('#overlay').classList.add('open'); showBasket(); }
function closeDrawer(){ $('#drawer').classList.remove('open'); $('#overlay').classList.remove('open'); }
function total(){ var t=0; for (var k in basket) if(bySku[k]) t+=bySku[k].price*basket[k]; return t; }

function showBasket(msg){
  $('#drawerTitle').textContent = 'Your basket';
  var keys = Object.keys(basket).filter(function(k){return bySku[k] && basket[k]>0});
  if (!keys.length){ $('#drawerBody').innerHTML = (msg||'')+'<p class="empty-note">Your basket is empty.</p>'; $('#drawerFoot').innerHTML=''; return; }
  $('#drawerBody').innerHTML = (msg||'') + keys.map(function(k){
    var p=bySku[k], q=basket[k];
    return '<div class="line"><img src="'+img(p.photos[0])+'" alt=""><div><div class="t">'+esc(p.name)+'</div><div class="small">'+fmt(p.price)+'</div>'+
      '<div class="qty"><button data-dec="'+esc(k)+'" aria-label="Less">−</button><span>'+q+'</span><button data-inc="'+esc(k)+'" aria-label="More"'+(q>=p.available?' disabled':'')+'>+</button><button class="rm" data-rm="'+esc(k)+'">Remove</button></div></div>'+
      '<div class="price">'+fmt(p.price*q)+'</div></div>';
  }).join('');
  $('#drawerFoot').innerHTML = '<div class="tot"><span>Subtotal</span><span>'+fmt(total())+'</span></div><p class="small" style="margin:0 0 10px">Delivery charges will be informed prior to payment.</p><button class="btn wide" id="toCheckout">Checkout</button>';
}

function showCheckout(errText){
  $('#drawerTitle').textContent = 'Checkout';
  $('#drawerBody').innerHTML =
    '<div class="how"><strong>How ordering works</strong><ol>'+
    '<li>Place your order. The items are reserved for you.</li>'+
    '<li>We will message you on WhatsApp with the delivery charge and payment details.</li>'+
    '<li>Once payment is received, your order is delivered to your address.</li></ol></div>'+
    '<form id="orderForm" novalidate>'+
    '<label for="f-name">Name</label><input id="f-name" name="name" autocomplete="name" required maxlength="100">'+
    '<label for="f-address">Delivery address</label><textarea id="f-address" name="address" autocomplete="street-address" required maxlength="400"></textarea>'+
    '<label for="f-wa">WhatsApp number</label><input id="f-wa" name="whatsapp" type="tel" autocomplete="tel" placeholder="07X XXX XXXX" required maxlength="30">'+
    '<label for="f-notes">Other comments <span>(optional)</span></label><textarea id="f-notes" name="comments" maxlength="500"></textarea>'+
    '<input class="hp" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">'+
    '<p class="note"><strong>Note:</strong> Delivery charges will be informed prior to payment.</p>'+
    '<p class="err" id="formErr">'+(errText||'')+'</p></form>';
  $('#drawerFoot').innerHTML = '<div class="tot"><span>Subtotal</span><span>'+fmt(total())+'</span></div>'+
    '<div style="display:flex;gap:8px"><button class="btn ghost" id="backToBasket">Back</button><button class="btn wide" id="placeOrder">Place order</button></div>';
}

function placeOrder(){
  var f = $('#orderForm'), d = {};
  ['name','address','whatsapp','comments','website'].forEach(function(n){ d[n] = f.elements[n].value.trim(); });
  if (!d.name || !d.address || !d.whatsapp){ $('#formErr').textContent = 'Please fill in your name, address and WhatsApp number.'; return; }
  if (d.whatsapp.replace(/\D/g,'').length < 9){ $('#formErr').textContent = 'Please check your WhatsApp number.'; return; }
  d.items = Object.keys(basket).filter(function(k){return basket[k]>0}).map(function(k){return {sku:k, qty:basket[k]}});
  var btn = $('#placeOrder'); btn.disabled = true; btn.textContent = 'Placing order…'; $('#formErr').textContent='';
  var req = API ? fetch(API, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(d)}).then(function(r){return r.json()})
               : Promise.resolve({ok:true, orderId:'PREVIEW', total: total()});
  req.then(function(res){
    if (res.ok){
      var t = total(); basket = {}; save();
      $('#drawerTitle').textContent = 'Order placed';
      $('#drawerBody').innerHTML = '<div class="done"><div>Thank you, '+esc(d.name.split(' ')[0])+'.</div><div class="big">Order '+esc(res.orderId)+'</div>'+
        '<p>Subtotal '+fmt(res.total||t)+'</p><p>We will message you on WhatsApp at <strong>'+esc(d.whatsapp)+'</strong> with the delivery charge and payment details. Your items are reserved for you.</p></div>';
      $('#drawerFoot').innerHTML = '<button class="btn wide" id="keepShopping">Continue shopping</button>';
      fetchProducts();
    } else {
      if (res.unavailable){
        res.unavailable.forEach(function(u){ if(u.available>0) basket[u.sku]=Math.min(basket[u.sku],u.available); else delete basket[u.sku]; });
        save();
        var names = res.unavailable.map(function(u){return esc(u.name)}).join(', ');
        fetchProducts().then(function(){ showBasket('<p class="err" style="margin:0 0 10px">Sorry, someone has just ordered: '+names+'. Your basket has been updated.</p>'); });
      } else { btn.disabled=false; btn.textContent='Place order'; $('#formErr').textContent = res.error || 'Something went wrong. Please try again.'; }
    }
  }).catch(function(){ btn.disabled=false; btn.textContent='Place order'; $('#formErr').textContent='Could not reach the shop. Check your connection and try again.'; });
}

// ---- events ----
document.addEventListener('click', function(e){
  var t = e.target.closest('button,img[data-thumb]') || e.target;
  if (t.dataset.add){ add(t.dataset.add); if (t.hasAttribute('data-close-modal')) closeModal(); return; }
  if (t.hasAttribute && t.hasAttribute('data-close-modal')) return closeModal();
  if (t.dataset.open) return openProduct(t.dataset.open);
  if (t.dataset.thumb){ $('#mainImg').src = img(t.dataset.thumb); document.querySelectorAll('.thumbs img').forEach(function(i){i.classList.toggle('on', i===t)}); return; }
  if (t.dataset.cat !== undefined && t.classList.contains('chip')){ filter = t.dataset.cat; document.querySelectorAll('.chip').forEach(function(c){c.setAttribute('aria-pressed', c===t)}); render(); return; }
  if (t.dataset.inc){ var p=bySku[t.dataset.inc]; basket[p.sku]=Math.min(basket[p.sku]+1,p.available); save(); showBasket(); render(); return; }
  if (t.dataset.dec){ var k=t.dataset.dec; basket[k]--; if(basket[k]<=0) delete basket[k]; save(); showBasket(); render(); return; }
  if (t.dataset.rm){ delete basket[t.dataset.rm]; save(); showBasket(); render(); return; }
  if (t.id==='basketBtn') return openDrawer();
  if (t.id==='closeDrawer' || t.id==='keepShopping') return closeDrawer();
  if (t.id==='overlay'){ closeModal(); closeDrawer(); return; }
  if (t.id==='toCheckout') return showCheckout();
  if (t.id==='backToBasket') return showBasket();
  if (t.id==='placeOrder') return placeOrder();
  if (t.id==='modal') return closeModal();
});
document.addEventListener('input', function(e){ if(e.target.closest('#orderForm')){ var x=$('#formErr'); if(x) x.textContent=''; } });
document.addEventListener('keydown', function(e){ if(e.key==='Escape'){ closeModal(); closeDrawer(); } });

updateCount(); fetchProducts();
})();
</script>
</body>
</html>
